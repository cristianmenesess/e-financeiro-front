<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cadastro — E-Financeiro</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F1F6F5">
    <link rel="icon" href="assets/imagens/icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/imagens/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="E-Financeiro">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="design-system/ds.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/pwa.js"></script>
</head>

<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <button class="ef-icon-btn ef-icon-btn--surface ef-icon-btn--lg theme-toggle theme-toggle--auth" title="Alternar tema" aria-label="Alternar tema">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="auth-page">
        <div class="auth-card ef-card ef-card--pad-roomy">
            <div class="auth-logo">
                <img src="design-system/assets/logo-lockup.png" alt="E-Financeiro">
            </div>

            <input class="ef-input" type="text" id="inputNome" placeholder="Nome completo">
            <input class="ef-input" type="email" id="inputEmail" placeholder="E-mail">
            <input class="ef-input" type="password" id="inputSenha" placeholder="Senha (mínimo 8 caracteres)">

            <button class="ef-btn ef-btn--primary ef-btn--lg ef-btn--block" id="btnCadastrar">Criar conta</button>

            <p class="auth-link">Já tem conta? <a href="login.html">Entrar</a></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="assets/js/cadastro.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login — E-Financeiro</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F1F6F5">
    <link rel="icon" href="assets/imagens/icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/imagens/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="E-Financeiro">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="design-system/ds.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/pwa.js"></script>
</head>

<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <button class="ef-icon-btn ef-icon-btn--surface ef-icon-btn--lg theme-toggle theme-toggle--auth" title="Alternar tema" aria-label="Alternar tema">
        <i data-lucide="moon" class="ef-icon ef-icon--md"></i>
    </button>

    <div class="auth-page">
        <div class="auth-card ef-card ef-card--pad-roomy">
            <div class="auth-logo">
                <img src="design-system/assets/logo-lockup.png" alt="E-Financeiro">
            </div>

            <div class="ef-field">
                <label class="ef-field__label" for="inputEmail">E-mail</label>
                <input class="ef-input" type="email" id="inputEmail" placeholder="voce@exemplo.com" autocomplete="email">
            </div>
            <div class="ef-field">
                <label class="ef-field__label" for="inputSenha">Senha</label>
                <input class="ef-input" type="password" id="inputSenha" autocomplete="current-password">
            </div>
            <a class="forgot-password-link" href="#" id="linkEsqueciSenha">Esqueceu a senha?</a>

            <button class="ef-btn ef-btn--primary ef-btn--lg ef-btn--block" id="btnLogin">Entrar</button>

            <p class="auth-link">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
    </div>

    <!-- MODAL: ESQUECI A SENHA -->
    <div class="ef-dialog ef-dialog--auto" id="modalEsqueciSenha" role="dialog" aria-modal="true" aria-labelledby="modalEsqueciSenhaTitle" hidden>
        <div class="ef-dialog__panel">
            <span class="ef-dialog__handle" aria-hidden="true"></span>
            <div class="ef-dialog__head">
                <div class="ef-dialog__text">
                    <h2 class="ef-dialog__title" id="modalEsqueciSenhaTitle">Esqueceu a senha?</h2>
                </div>
                <button type="button" class="ef-dialog__close" id="btnFecharEsqueciSenha" aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="M6 6l12 12" /></svg></button>
            </div>

            <div id="formEsqueciSenha">
                <p class="auth-help-text">Informe seu e-mail cadastrado e enviaremos um link para redefinir sua senha.</p>
                <div class="ef-field">
                    <label class="ef-field__label" for="inputEmailReset">E-mail</label>
                    <input class="ef-input" type="email" id="inputEmailReset" placeholder="voce@exemplo.com" autocomplete="email">
                </div>
                <button class="ef-btn ef-btn--primary ef-btn--lg ef-btn--block" id="btnEnviarReset">Enviar link</button>
            </div>

            <div class="auth-feedback auth-feedback--success" id="successEsqueciSenha">
                <span class="auth-feedback__icon"><i data-lucide="mail-check" class="ef-icon ef-icon--lg"></i></span>
                <p>Se esse e-mail estiver cadastrado, você vai receber um link para redefinir sua senha em instantes.</p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
    <script src="assets/js/icones.js"></script>
    <script src="assets/js/feedback.js"></script>
    <script src="assets/js/senha.js"></script>
    <script src="assets/js/login.js"></script>

</body>

</html>

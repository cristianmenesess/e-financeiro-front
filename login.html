<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — E-Financeiro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
</head>

<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <button class="theme-toggle theme-toggle--auth" title="Alternar tema">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fa-solid fa-chart-line"></i>
                <span>E-Financeiro</span>
            </div>

            <input class="modal-input" type="email" id="inputEmail" placeholder="E-mail">
            <input class="modal-input" type="password" id="inputSenha" placeholder="Senha">
            <a class="forgot-password-link" href="#" id="linkEsqueciSenha">Esqueceu a senha?</a>

            <button class="modal-confirm" id="btnLogin">Entrar</button>

            <p class="auth-link">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
    </div>

    <!-- MODAL: ESQUECI A SENHA -->
    <div class="modal-backdrop" id="modalEsqueciSenha">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <h2 class="modal-title">Esqueceu a senha?</h2>

            <div id="formEsqueciSenha">
                <p class="auth-help-text">Informe seu e-mail cadastrado e enviaremos um link para redefinir sua senha.</p>
                <input class="modal-input" type="email" id="inputEmailReset" placeholder="E-mail">
                <button class="modal-confirm" id="btnEnviarReset">Enviar link</button>
            </div>

            <div class="auth-feedback auth-feedback--success" id="successEsqueciSenha">
                <i class="fa-solid fa-envelope-circle-check"></i>
                <p>Se esse e-mail estiver cadastrado, você vai receber um link para redefinir sua senha em instantes.</p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="assets/js/login.js"></script>

</body>

</html>

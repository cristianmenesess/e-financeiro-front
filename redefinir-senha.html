<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Redefinir senha — E-Financeiro</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F1F6F5">
    <link rel="icon" href="assets/imagens/icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/imagens/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="E-Financeiro">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="design-system/ds.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/pwa.js"></script>
</head>

<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <button class="ef-icon-btn ef-icon-btn--surface ef-icon-btn--lg theme-toggle theme-toggle--auth" title="Alternar tema" aria-label="Alternar tema">
        <i data-lucide="moon" class="ef-icon ef-icon--md"></i>
    </button>

    <div class="auth-page">
        <div class="auth-card ef-card ef-card--pad-roomy">
            <div class="auth-logo">
                <img src="design-system/assets/logo-lockup.png" alt="E-Financeiro">
            </div>

            <div id="formRedefinirSenha">
                <p class="auth-help-text">Escolha uma nova senha para acessar sua conta.</p>
                <div class="ef-field">
                    <label class="ef-field__label" for="inputNovaSenha">Nova senha</label>
                    <input class="ef-input" type="password" id="inputNovaSenha" autocomplete="new-password">
                    <span class="ef-field__message">Mínimo de 8 caracteres.</span>
                </div>
                <div class="ef-field">
                    <label class="ef-field__label" for="inputConfirmarSenha">Confirmar nova senha</label>
                    <input class="ef-input" type="password" id="inputConfirmarSenha" autocomplete="new-password">
                </div>

                <button class="ef-btn ef-btn--primary ef-btn--lg ef-btn--block" id="btnRedefinir">Redefinir senha</button>
            </div>

            <div class="auth-feedback auth-feedback--error" id="erroToken">
                <span class="auth-feedback__icon"><i data-lucide="circle-alert" class="ef-icon ef-icon--lg"></i></span>
                <p>Link inválido ou expirado. Solicite um novo link na tela de login.</p>
                <a href="login.html">Voltar para o login</a>
            </div>

            <p class="auth-link">Lembrou a senha? <a href="login.html">Entrar</a></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
    <script src="assets/js/icones.js"></script>
    <script src="assets/js/feedback.js"></script>
    <script src="assets/js/redefinir-senha.js"></script>

</body>

</html>

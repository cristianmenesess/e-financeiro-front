<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha — E-Financeiro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
</head>

<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <button class="theme-toggle theme-toggle--auth" title="Alternar tema">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fa-solid fa-chart-line"></i>
                <span>E-Financeiro</span>
            </div>

            <div id="formRedefinirSenha">
                <p class="auth-help-text">Escolha uma nova senha para acessar sua conta.</p>
                <input class="modal-input" type="password" id="inputNovaSenha" placeholder="Nova senha (mínimo 8 caracteres)">
                <input class="modal-input" type="password" id="inputConfirmarSenha" placeholder="Confirmar nova senha">

                <button class="modal-confirm" id="btnRedefinir">Redefinir senha</button>
            </div>

            <div class="auth-feedback auth-feedback--error" id="erroToken">
                <i class="fa-solid fa-circle-exclamation"></i>
                <p>Link inválido ou expirado. Solicite um novo link na tela de login.</p>
                <a href="login.html">Voltar para o login</a>
            </div>

            <p class="auth-link">Lembrou a senha? <a href="login.html">Entrar</a></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="assets/js/redefinir-senha.js"></script>

</body>

</html>
